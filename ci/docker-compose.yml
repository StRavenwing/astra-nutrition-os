name: astra-nutrition-os

services:
  astra:
    build:
      context: ..
      dockerfile: Dockerfile
    image: astra-nutrition-os:local
    container_name: astra-nutrition-os
    environment:
      ASTRA_HOST: 0.0.0.0
      ASTRA_PORT: 8787
      ASTRA_DB_PATH: .data/Astra_Nutrition_OS_v7.sqlite
      ASTRA_BACKUP_DIR: .data/backups
      ASTRA_ADMIN_EMAIL: ${ASTRA_ADMIN_EMAIL:?Set ASTRA_ADMIN_EMAIL in .env}
      ASTRA_ADMIN_PASSWORD: ${ASTRA_ADMIN_PASSWORD:?Set ASTRA_ADMIN_PASSWORD in .env}
      ASTRA_AUTH_SECRET: ${ASTRA_AUTH_SECRET:?Set ASTRA_AUTH_SECRET in .env}
      ASTRA_ACCESS_TOKEN_MINUTES: ${ASTRA_ACCESS_TOKEN_MINUTES:-10080}
    ports:
      - "${ASTRA_PORT:-8787}:8787"
    volumes:
      - ../.data:/app/.data
    restart: unless-stopped
