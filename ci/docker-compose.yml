name: astra-nutrition-os

services:
  astra:
    build:
      context: ..
      dockerfile: Dockerfile
    image: astra-nutrition-os:local
    container_name: astra-nutrition-os
    env_file:
      - ../.env
    environment:
      ASTRA_HOST: 0.0.0.0
      ASTRA_PORT: 8787
      ASTRA_DB_PATH: .data/Astra_Nutrition_OS_v7.sqlite
      ASTRA_BACKUP_DIR: .data/backups
    ports:
      - "${ASTRA_PORT:-8787}:8787"
    volumes:
      - ../.data:/app/.data
    restart: unless-stopped
