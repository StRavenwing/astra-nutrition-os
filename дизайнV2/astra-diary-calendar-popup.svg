<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1000" viewBox="0 0 1440 1000">
<defs><style>
.s{font-family:Inter,Arial,sans-serif}.ink{fill:#172033}.muted{fill:#7D879B}.soft{fill:#AAB6C8}.white{fill:#fff}.green{fill:#329A63}.blue{fill:#6F82FF}.red{fill:#D55555}.h1{font-size:26px;font-weight:750}.h2{font-size:18px;font-weight:750}.h3{font-size:15px;font-weight:750}.body{font-size:13px;font-weight:550}.small{font-size:11px;font-weight:550}.tiny{font-size:9px;font-weight:700;letter-spacing:1px}
</style></defs>
<rect width="1440" height="1000" fill="#F6F8FC"/><rect x="0" y="0" width="248" height="1000" fill="#0E1728"/><rect x="248" y="0" width="1192" height="1000" fill="#172033" opacity=".52"/>
<g class="s" opacity=".42"><text x="288" y="70" class="white h1">Дневник питания</text><rect x="288" y="120" width="1028" height="100" rx="18" fill="#0E1728"/><rect x="288" y="260" width="704" height="420" rx="20" fill="#fff"/><rect x="1020" y="260" width="296" height="420" rx="20" fill="#fff"/><rect x="288" y="720" width="1028" height="170" rx="20" fill="#fff"/></g>
<rect x="352" y="76" width="900" height="850" rx="24" fill="#fff"/>
<g class="s"><text x="388" y="120" class="muted tiny">FOOD CALENDAR · ПРОСМОТР ДНЯ</text><text x="388" y="160" class="ink h1">Пятница, 21 августа 2026</text><circle cx="1200" cy="124" r="22" fill="#F1F3F7"/><path d="M1193 117l14 14M1207 117l-14 14" stroke="#172033" stroke-width="2" stroke-linecap="round"/>
<rect x="388" y="188" width="828" height="62" rx="14" fill="#F6F8FC"/><text x="416" y="214" class="muted tiny">ИТОГ ЗА ДЕНЬ</text><text x="416" y="238" class="ink body" font-weight="700">2 приёма · 1 100 ккал · белок 38 г · жиры 70 г</text><text x="1044" y="228" class="blue small" font-weight="700">Изменить день</text>
<!-- breakfast -->
<text x="388" y="290" class="ink h2">Завтрак <tspan class="muted small">· 420 ккал</tspan></text><rect x="388" y="308" width="828" height="72" rx="12" fill="#fff" stroke="#E5EAF2"/><circle cx="420" cy="344" r="15" fill="#E2F7EB"/><text x="450" y="338" class="ink body" font-weight="700">Овсяная каша с ягодами</text><text x="450" y="360" class="muted small">1 порция · белок 12 г · жиры 8 г</text><text x="1120" y="348" class="ink body" font-weight="700">280 ккал</text><rect x="388" y="388" width="828" height="72" rx="12" fill="#fff" stroke="#E5EAF2"/><circle cx="420" cy="424" r="15" fill="#E2F7EB"/><text x="450" y="418" class="ink body" font-weight="700">Йогурт с ягодами</text><text x="450" y="440" class="muted small">1 порция · белок 6 г · жиры 4 г</text><text x="1120" y="428" class="ink body" font-weight="700">140 ккал</text>
<rect x="388" y="472" width="828" height="36" rx="10" fill="#EAF2FF" stroke="#79A8FF"/><text x="724" y="495" class="blue small" font-weight="700">＋ Добавить блюдо в завтрак</text>
<!-- lunch -->
<text x="388" y="552" class="ink h2">Обед <tspan class="muted small">· 680 ккал</tspan></text><rect x="388" y="570" width="828" height="72" rx="12" fill="#fff" stroke="#E5EAF2"/><circle cx="420" cy="606" r="15" fill="#F0F1FF"/><text x="450" y="600" class="ink body" font-weight="700">Курица с рисом и овощами</text><text x="450" y="622" class="muted small">1 порция · белок 20 г · жиры 16 г</text><text x="1120" y="610" class="ink body" font-weight="700">680 ккал</text><rect x="388" y="654" width="828" height="36" rx="10" fill="#EAF2FF" stroke="#79A8FF"/><text x="724" y="677" class="blue small" font-weight="700">＋ Добавить блюдо в обед</text>
<!-- metrics -->
<rect x="388" y="722" width="828" height="126" rx="16" fill="#172033"/><text x="416" y="754" fill="#BDF2D3" class="tiny">НУТРИЕНТЫ ДНЯ</text><g><rect x="416" y="772" width="226" height="54" rx="10" fill="#222D42"/><text x="434" y="795" fill="#AAB6C8" class="tiny">КАЛОРИИ</text><text x="434" y="814" fill="#fff" class="body" font-weight="700">1 100 / 2 100 · осталось 1 000</text></g><g><rect x="658" y="772" width="226" height="54" rx="10" fill="#E2F7EB"/><text x="676" y="795" class="green tiny">БЕЛОК · НОРМА ДОСТИГНУТА</text><text x="676" y="814" class="ink body" font-weight="700">110 / 110 г · отлично</text></g><g><rect x="900" y="772" width="286" height="54" rx="10" fill="#FFF1F0" stroke="#FFB4AA"/><text x="918" y="795" class="red tiny">ЖИРЫ · МАКСИМУМ ДОСТИГНУТ</text><text x="918" y="814" class="red body" font-weight="700">70 / 70 г · осталось 0 г</text></g>
<rect x="388" y="872" width="128" height="36" rx="10" fill="#F7F8FA" stroke="#CCD3DF"/><text x="421" y="895" class="muted small" font-weight="700">Отмена</text><rect x="1068" y="872" width="148" height="36" rx="10" fill="#172033"/><text x="1100" y="895" class="white small" font-weight="700">＋ Добавить запись</text>
