<svg xmlns="http://www.w3.org/2000/svg" width="1360" height="980" viewBox="0 0 1360 980"><defs><style>.s{font-family:Inter,Arial,sans-serif}.ink{fill:#172033}.muted{fill:#7D879B}.white{fill:#fff}.body{font-size:14px;font-weight:600}.small{font-size:12px;font-weight:600}.h1{font-size:26px;font-weight:750;letter-spacing:-.6px}.h2{font-size:18px;font-weight:700}.label{font-size:10px;font-weight:700;letter-spacing:1px}</style></defs><rect width="1360" height="980" fill="#F6F8FC"/><g class="s"><text x="56" y="64" class="ink h1">Astra UI · система кнопок</text><text x="56" y="92" class="muted" font-size="14">Единые размеры, иерархия действий и понятные destructive-состояния</text><text x="56" y="144" class="muted label">PRIMARY ACTIONS · ОСНОВНЫЕ ДЕЙСТВИЯ</text><rect x="56" y="168" width="174" height="48" rx="12" fill="#172033"/><text x="94" y="198" class="white body">＋ Добавить</text><rect x="248" y="168" width="174" height="48" rx="12" fill="#172033"/><text x="284" y="198" class="white body">Сохранить</text><rect x="440" y="168" width="174" height="48" rx="12" fill="#172033"/><text x="485" y="198" class="white body">Открыть</text><rect x="632" y="168" width="174" height="48" rx="12" fill="#172033"/><text x="672" y="198" class="white body">Продолжить →</text><rect x="824" y="168" width="220" height="48" rx="12" fill="#172033"/><text x="858" y="198" class="white body">＋ Добавить рецепт</text><text x="56" y="242" class="muted small">Высота 48 px · radius 12 · #172033 · текст #FFFFFF · используют главные действия страницы и popup.</text>
<text x="56" y="302" class="muted label">SECONDARY / SOFT · ВТОРИЧНЫЕ ДЕЙСТВИЯ</text><rect x="56" y="326" width="174" height="44" rx="11" fill="#E2F7EB"/><text x="100" y="354" fill="#329A63" class="body">＋ Категория</text><rect x="248" y="326" width="174" height="44" rx="11" fill="#EAF2FF"/><text x="294" y="354" fill="#6F82FF" class="body">Редактировать</text><rect x="440" y="326" width="174" height="44" rx="11" fill="#F6F8FC" stroke="#DDE3EC"/><text x="489" y="354" class="muted body">Отмена</text><rect x="632" y="326" width="174" height="44" rx="11" fill="#F6F8FC" stroke="#DDE3EC"/><text x="666" y="354" class="muted body">Закрыть</text><rect x="824" y="326" width="220" height="44" rx="11" fill="#F0F1FF"/><text x="868" y="354" fill="#6F82FF" class="body">Открыть Food Calendar</text><text x="56" y="396" class="muted small">Высота 44 px · radius 11 · soft backgrounds for secondary, navigation and reversible actions.</text>
<text x="56" y="456" class="muted label">DANGER · НЕОБРАТИМЫЕ ДЕЙСТВИЯ</text><rect x="56" y="480" width="174" height="44" rx="11" fill="#FFF0ED" stroke="#F3A59A"/><text x="106" y="508" fill="#D56666" class="body">Удалить</text><rect x="248" y="480" width="206" height="44" rx="11" fill="#D56666"/><text x="296" y="508" class="white body">Удалить рецепт</text><rect x="472" y="480" width="206" height="44" rx="11" fill="#FFF0ED"/><text x="508" y="508" fill="#D56666" class="body">Открепить</text><rect x="696" y="480" width="206" height="44" rx="11" fill="#FFF0ED"/><text x="736" y="508" fill="#D56666" class="body">Удалить запись</text><text x="56" y="550" class="muted small">Delete всегда отделён от сохранения визуально и требует подтверждения в popup.</text>
<text x="56" y="610" class="muted label">ICON ACTIONS · ДЕЙСТВИЯ В КАРТОЧКАХ</text><g><rect x="56" y="634" width="38" height="38" rx="10" fill="#EAF2FF"/><path d="m75 644 2 5 5 1-4 4 1 5-4-3-4 3 1-5-4-4 5-1 2-5Z" fill="none" stroke="#6F82FF" stroke-width="1.7"/><text x="108" y="658" class="muted small">Закрепить</text><rect x="208" y="634" width="38" height="38" rx="10" fill="#F6F8FC"/><path d="M216 662h22m-19-7 16-13m-16 0h16v16" fill="none" stroke="#7D879B" stroke-width="1.7"/><text x="260" y="658" class="muted small">Редактировать</text><rect x="384" y="634" width="38" height="38" rx="10" fill="#F6F8FC"/><path d="M392 644h22m-18 0v18h14v-18m-10-4h6" fill="none" stroke="#7D879B" stroke-width="1.7"/><text x="436" y="658" class="muted small">Скрыть</text><rect x="522" y="634" width="38" height="38" rx="10" fill="#FFF0ED"/><path d="M530 644h22m-18 0v18h14v-18m-10-4h6" fill="none" stroke="#D56666" stroke-width="1.7"/><text x="574" y="658" class="muted small">Удалить</text><rect x="664" y="634" width="38" height="38" rx="10" fill="#F6F8FC"/><text x="676" y="659" class="muted" font-size="18">•••</text><text x="716" y="658" class="muted small">Ещё</text></g>
<text x="56" y="738" class="muted label">STATES · СОСТОЯНИЯ</text><rect x="56" y="762" width="156" height="44" rx="11" fill="#172033"/><text x="106" y="790" class="white body">Default</text><rect x="232" y="762" width="156" height="44" rx="11" fill="#26364A"/><text x="282" y="790" class="white body">Hover</text><rect x="408" y="762" width="156" height="44" rx="11" fill="#8994A7"/><text x="454" y="790" fill="#DDE3EC" class="body">Disabled</text><rect x="584" y="762" width="156" height="44" rx="11" fill="#172033"/><circle cx="630" cy="784" r="7" fill="none" stroke="#BDF2D3" stroke-width="2" stroke-dasharray="6 3"/><text x="650" y="790" class="white body">Сохранение…</text><rect x="760" y="762" width="156" height="44" rx="11" fill="#BDF2D3"/><text x="815" y="790" fill="#172033" class="body">Success</text><text x="56" y="844" class="muted small">Фокус-контур для клавиатуры: 2 px #6F82FF + 2 px offset. Touch target: не менее 44×44 px.</text><rect x="56" y="884" width="988" height="54" rx="14" fill="#172033"/><text x="84" y="918" fill="#BDF2D3" class="small" font-weight="700">RULE</text><text x="146" y="918" fill="#fff" class="small">На одной карточке — одна primary-кнопка. Остальные действия переводим в icon actions или overflow menu.</text></g></svg>
