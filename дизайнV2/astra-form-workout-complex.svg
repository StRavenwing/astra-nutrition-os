<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="860" viewBox="0 0 1200 860"><defs><style>.s{font-family:Inter,Arial,sans-serif}.ink{fill:#172033}.muted{fill:#7D879B}.white{fill:#fff}.body{font-size:14px;font-weight:500}.small{font-size:12px;font-weight:500}.h2{font-size:20px;font-weight:750}.label{font-size:10px;font-weight:700;letter-spacing:1px}</style></defs><rect width="1200" height="860" fill="#E9EDF4"/><rect x="110" y="28" width="980" height="804" rx="22" fill="#fff"/><g class="s"><text x="154" y="80" class="ink h2">Создать комплекс тренировок</text><text x="154" y="108" class="muted body">Соберите повторяемую программу из упражнений</text><text x="154" y="160" class="muted small">Название комплекса</text><rect x="154" y="174" width="438" height="48" rx="10" fill="#fff" stroke="#DDE3EC"/><text x="176" y="204" class="muted body">Например, силовая база</text><text x="612" y="160" class="muted small">Комментарий</text><rect x="612" y="174" width="434" height="48" rx="10" fill="#fff" stroke="#DDE3EC"/><text x="634" y="204" class="muted body">35 минут · грудь и спина</text><text x="154" y="264" class="ink body" font-weight="700">Упражнения</text><rect x="154" y="286" width="892" height="46" rx="10" fill="#EDF1F7"/><text x="178" y="315" class="muted label">№</text><text x="236" y="315" class="muted label">УПРАЖНЕНИЕ</text><text x="736" y="315" class="muted label">ПОДХОДЫ</text><text x="840" y="315" class="muted label">ПОВТОРЫ</text><text x="154" y="380" class="muted small">1</text><text x="236" y="380" class="ink body">Жим гантелей лёжа</text><text x="736" y="380" class="ink body">3</text><text x="840" y="380" class="ink body">12</text><text x="1000" y="380" class="muted">×</text><line x1="154" y1="406" x2="1046" y2="406" stroke="#EDF0F5"/><text x="154" y="454" class="muted small">2</text><text x="236" y="454" class="ink body">Тяга верхнего блока</text><text x="736" y="454" class="ink body">3</text><text x="840" y="454" class="ink body">10</text><text x="1000" y="454" class="muted">×</text><line x1="154" y1="480" x2="1046" y2="480" stroke="#EDF0F5"/><text x="154" y="528" class="muted small">3</text><text x="236" y="528" class="ink body">Разводка с гантелями</text><text x="736" y="528" class="ink body">3</text><text x="840" y="528" class="ink body">12</text><text x="1000" y="528" class="muted">×</text><rect x="154" y="572" width="188" height="38" rx="10" fill="#E2F7EB"/><text x="188" y="596" fill="#329A63" class="small" font-weight="700">＋ Добавить упражнение</text><text x="154" y="666" class="muted small">Комплекс можно закрепить в списке и повторно использовать при планировании.</text><line x1="154" y1="710" x2="1046" y2="710" stroke="#EDF0F5"/><text x="154" y="756" fill="#D56666" class="small" font-weight="700">Удалить комплекс</text><rect x="850" y="732" width="88" height="38" rx="10" fill="#F6F8FC"/><text x="872" y="756" class="muted small">Отмена</text><rect x="952" y="732" width="94" height="38" rx="10" fill="#172033"/><text x="974" y="756" fill="#fff" class="small" font-weight="700">Сохранить</text></g></svg>
