<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="860" viewBox="0 0 1200 860"><defs><style>.s{font-family:Inter,Arial,sans-serif}.ink{fill:#172033}.muted{fill:#7D879B}.white{fill:#fff}.body{font-size:14px;font-weight:500}.small{font-size:12px;font-weight:500}.h2{font-size:20px;font-weight:750}</style></defs><rect width="1200" height="860" fill="#E9EDF4"/><rect x="134" y="42" width="932" height="776" rx="22" fill="#fff"/><g class="s"><text x="182" y="94" class="ink h2">Добавить продукт</text><text x="182" y="122" class="muted body">Заполните карточку продукта или считайте КБЖУ с упаковки</text><rect x="182" y="152" width="836" height="72" rx="14" fill="#E2F7EB"/><text x="208" y="184" fill="#329A63" class="small" font-weight="700">СКАН УПАКОВКИ</text><text x="208" y="207" class="ink body">КБЖУ с этикетки</text><rect x="852" y="168" width="140" height="38" rx="10" fill="#172033"/><text x="880" y="192" fill="#fff" class="small" font-weight="700">Выбрать фото</text><text x="182" y="266" class="ink body" font-weight="700">Основная информация</text><text x="182" y="300" class="muted small">ID продукта</text><rect x="182" y="314" width="260" height="48" rx="10" fill="#F6F8FC"/><text x="204" y="344" class="muted body">Автоматически: P-…</text><text x="466" y="300" class="muted small">Название</text><rect x="466" y="314" width="260" height="48" rx="10" fill="#fff" stroke="#DDE3EC"/><text x="488" y="344" class="muted body">Например, авокадо</text><text x="750" y="300" class="muted small">Категория</text><rect x="750" y="314" width="268" height="48" rx="10" fill="#fff" stroke="#DDE3EC"/><text x="772" y="344" class="ink body">Фрукты ▾</text><text x="182" y="404" class="muted small">Единица</text><rect x="182" y="418" width="260" height="48" rx="10" fill="#fff" stroke="#DDE3EC"/><text x="204" y="448" class="ink body">г ▾</text><text x="466" y="404" class="muted small">Цена упаковки</text><rect x="466" y="418" width="260" height="48" rx="10" fill="#fff" stroke="#DDE3EC"