<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="720" viewBox="0 0 1000 720"><defs><style>.s{font-family:Inter,Arial,sans-serif}.ink{fill:#172033}.muted{fill:#7D879B}.white{fill:#fff}.body{font-size:14px;font-weight:500}.small{font-size:12px;font-weight:500}.h2{font-size:20px;font-weight:750}</style></defs><rect width="1000" height="720" fill="#E9EDF4"/><rect x="120" y="30" width="760" height="660" rx="22" fill="#fff"/><g class="s"><text x="164" y="82" class="ink h2">Добавить тренажёр или инвентарь</text><text x="164" y="110" class="muted body">Карточка оборудования для справочника</text><text x="164" y="162" class="muted small">Тип</text><rect x="164" y="176" width="260" height="48" rx="10" fill="#fff" stroke="#DDE3EC"/><text x="186" y="206" class="ink body">Оборудование ▾</text><text x="444" y="162" class="muted small">Название</text><rect x="444" y="176" width="392" height="48" rx="10" fill="#fff" stroke="#DDE3EC"/><text x="466" y="206" class="muted body">Например, силовая рама</text><text x="164" y="266" class="muted small">Описание</text><rect x="164" y="280" width="672" height="126" rx="12" fill="#fff" stroke="#DDE3EC"/><text x="186" y="314" class="muted body">Кратко опишите назначение и особенности…</text><text x="164" y="450" class="muted small">Фото</text><rect x="164" y="464" width="188" height="118" rx="12" fill="#F6F8FC"/><text x="208" y="524" fill="#8A95A7" font-size="28">＋</text><text x="196" y="554" class="muted small">Добавить фото</text><line x1="164" y1="622" x2="836" y2="622" stroke="#EDF0F5"/><rect x="730" y="640" width="86" height="38" rx="10" fill="#F6F8FC"/><text x="750" y="664" class="muted small">Отмена</text><rect x="826" y="640" width="70" height="38" rx="10" fill="#172033"/><text x="842" y="664" fill="#fff" class="small" font-weight="700">Сохранить</text></g></svg>
