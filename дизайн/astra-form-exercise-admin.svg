<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900"><defs><style>.s{font-family:Inter,Arial,sans-serif}.ink{fill:#172033}.muted{fill:#7D879B}.white{fill:#fff}.body{font-size:14px;font-weight:500}.small{font-size:12px;font-weight:500}.h2{font-size:20px;font-weight:750}.label{font-size:11px;font-weight:700;letter-spacing:.9px}</style></defs><rect width="1200" height="900" fill="#E9EDF4"/><rect x="104" y="26" width="992" height="848" rx="22" fill="#fff"/><g class="s"><text x="148" y="78" class="ink h2">Добавить упражнение</text><text x="148" y="106" class="muted body">Админская форма справочника упражнений</text><text x="148" y="156" class="muted small">Название</text><rect x="148" y="170" width="386" height="48" rx="10" fill="#fff" stroke="#DDE3EC"/><text x="170" y="200" class="muted body">Например, жим гантелей лёжа</text><text x="554" y="156" class="muted small">Группа мышц</text><rect x="554" y="170" width="220" height="48" rx="10" fill="#fff" stroke="#DDE3EC"/><text x="576" y="200" class="ink body">Грудь ▾</text><text x="794" y="156" class="muted small">Единица по умолчанию</text><rect x="794" y="170" width="302" height="48" rx="10" fill="#fff" stroke="#DDE3EC"/><text x="816" y="200" class="ink body">кг ▾</text><text x="148" y="260" class="muted small">Инвентарь</text><rect x="148" y="274" width="386" height="48" rx="10" fill="#fff" stroke="#DDE3EC"/><text x="170" y="304" class="ink body">Гантели ▾</text><text x="554" y="260" class="muted small">Тренажёр</text><rect x="554" y="274" width="542" height="48" rx="10" fill="#fff" stroke="#DDE3EC"/><text x="576" y="304" class="muted body">Необязательно</text><text x="148" y="364" class="muted small">Целевой RIR</text><rect x="148" y="378" width="220" height="48" rx="10" fill="#fff" stroke="#DDE3EC"/><text x="170" y="408" class="ink body">0–2</text><text x="388" y="364" class="muted small">Описание</text><rect x="388" y="378" width="708" height="48" rx="10" fill="#fff" stroke="#DDE3EC"/><text x="410" y="408" class="muted body">Короткое описание упражнения</text><text x="148" y="468" class="muted small">Техника выполнения</text><rect x="148" y="482" width="462" height="132" rx="12" fill="#fff" stroke="#DDE3EC"/><text x="170" y="514" class="muted body">Пошагово опишите технику…</text><text x="634" y="468" class="muted small">Полезные советы</text><rect x="634" y="482" width="462" height="132" rx="12" fill="#fff" stroke="#DDE3EC"/><text x="656" y="514" class="muted body">На что обратить внимание…</text><text x="148" y="656" class="muted small">Фотографии, до 6 файлов</text><rect x="148" y="670" width="200" height="36" rx="9" fill="#E2F7EB"/><text x="182" y="693" fill="#329A63" class="small" font-weight="700">＋ Добавить фото</text><text x="148" y="740" class="muted small">Описание может отображаться пользователям в карточке упражнения.</text><rect x="910" y="784" width="86" height="38" rx="10" fill="#F6F8FC"/><text x="930" y="808" class="muted small">Отмена</text><rect x="1006" y="784" width="90" height="38" rx="10" fill="#172033"/><text x="1030" y="808" fill="#fff" class="small" font-weight="700">Сохранить</text></g></svg>
