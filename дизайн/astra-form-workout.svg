<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="760" viewBox="0 0 1100 760"><defs><style>.s{font-family:Inter,Arial,sans-serif}.ink{fill:#172033}.muted{fill:#7D879B}.white{fill:#fff}.body{font-size:14px;font-weight:500}.small{font-size:12px;font-weight:500}.h2{font-size:20px;font-weight:750}</style></defs><rect width="1100" height="760" fill="#E9EDF4"/><rect x="140" y="32" width="820" height="696" rx="22" fill="#fff"/><g class="s"><text x="184" y="84" class="ink h2">Добавить тренировку</text><text x="184" y="112" class="muted body">Зафиксируйте упражнение, нагрузку и ощущения</text><text x="184" y="164" class="muted small">Дата</text><rect x="184" y="178" width="220" height="48" rx="10" fill="#fff" stroke="#DDE3EC"/><text x="206" y="208" class="ink body">21.08.2026</text><text x="424" y="164" class="muted small">Упражнение</text><rect x="424" y="178" width="492" height="48" rx="10" fill="#fff" stroke="#DDE3EC"/><text x="446" y="208" class="ink body">Жим гантелей лёжа ▾</text><text x="184" y="270" class="muted small">Рабочий вес</text><rect x="184" y="284" width="168" height="48" rx="10" fill="#fff" stroke="#DDE3EC"/><text x="206" y="314" class="ink body">12,5 кг</text><text x="370" y="270" class="muted small">Подходы</text><rect x="370" y="284" width="168" height="48" rx="10" fill="#fff" stroke="#DDE3EC"/><text x="392" y="314" class="ink body">3</text><text x="556" y="270" class="muted small">Повторы</text><rect x="556" y="284" width="168" height="48" rx="10" fill="#fff" stroke="#DDE3EC"/><text x="578" y="314" class="ink body">12</text><text x="742" y="270" class="muted small">RIR</text><rect x="742" y="284" width="174" height="48" rx="10" fill="#fff" stroke="#DDE3EC"/><text x="764" y="314" class="ink body">0–2 ▾</text><text x="184" y="376" class="muted small">Тренажёр / филиал</text><rect x="184" y="390" width="352" height="48" rx="10" fill="#fff" stroke="#DDE3EC"/><text x="206" y="420" class="muted body">Необязательно</text><text x="556" y="376" class