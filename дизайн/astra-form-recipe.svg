<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900"><defs><style>.s{font-family:Inter,Arial,sans-serif}.ink{fill:#172033}.muted{fill:#7D879B}.white{fill:#fff}.body{font-size:14px;font-weight:500}.small{font-size:12px;font-weight:500}.h2{font-size:20px;font-weight:750}</style></defs><rect width="1200" height="900" fill="#E9EDF4"/><rect x="120" y="28" width="960" height="844" rx="22" fill="#fff"/><g class="s"><text x="168" y="80" class="ink h2">Добавить рецепт</text><text x="168" y="108" class="muted body">Соберите состав, порции и пищевую ценность блюда</text><text x="168" y="160" class="muted small">Категория</text><rect x="168" y="174" width="220" height="48" rx="10" fill="#fff" stroke="#DDE3EC"/><text x="190" y="204" class="ink body">Основные блюда ▾</text><text x="410" y="160" class="muted small">ID рецепта</text><rect x="410" y="174" width="220" height="48" rx="10" fill="#F6F8FC"/><text x="432" y="204" class="muted body">Автоматически: M-…</text><text x="652" y="160" class="muted small">Название</text><rect x="652" y="174" width="380" height="48" rx="10" fill="#fff" stroke="#DDE3EC"/><text x="674" y="204" class="muted body">Например, боул с лососем</text><text x="168" y="264" class="muted small">Подкатегория</text><rect x="168" y="278" width="220" height="48" rx="10" fill="#fff" stroke="#DDE3EC"/><text x="190" y="308" class="muted body">Необязательно</text><text x="410" y="264" class="muted small">Версия</text><rect x="410" y="278" width="220" height="48" rx="10" fill="#fff" stroke="#DDE3EC"/><text x="432" y="308" class="ink body">1.0</text><text x="652" y="264" class="muted small">Количество порций</text><rect x="652" y="278" width="180" height="48" rx="10" fill="#fff" stroke="#DDE3EC"/><text x="674" y="308" class="ink body">2</text><text x="852" y="264" class="muted small">Теги</text><rect x="852" y="278" width="180" height="48" rx="10" fill="#fff" stroke="#DDE3EC"/><text x="874" y="308" class="muted body">#рыба</text><text