<svg xmlns="http://www.w3.org/2000/svg" width="760" height="520" viewBox="0 0 760 520"><defs><style>.s{font-family:Inter,Arial,sans-serif}.ink{fill:#172033}.muted{fill:#7D879B}.white{fill:#fff}.body{font-size:14px;font-weight:500}.small{font-size:12px;font-weight:500}.h2{font-size:20px;font-weight:750}</style></defs><rect width="760" height="520" fill="#E9EDF4"/><rect x="110" y="42" width="540" height="436" rx="22" fill="#fff"/><g class="s"><text x="150" y="94" class="ink h2">Добавить категорию</text><text x="150" y="122" class="muted body">Для продуктов или рецептов</text><text x="150" y="176" class="muted small">Название категории</text><rect x="150" y="190" width="460" height="48" rx="10" fill="#fff" stroke="#DDE3EC"/><text x="172" y="220" class="muted body">Например, Белковые</text><text x="150" y="278" class="muted small">Коллекция</text><rect x="150" y="292" width="460" height="48" rx="10" fill="#fff" stroke="#DDE3EC"/><text x="172" y="322" class="ink body">Общая коллекция ▾</text><text x="150" y="370" class="muted small">Общие категории видны всем пользователям, личные — только вам.</text><line x1="150" y1="404" x2="610" y2="404" stroke="#EDF0F5"/><rect x="436" y="422" width="74" height="36" rx="9" fill="#F6F8FC"/><text x="454" y="445" class="muted small">Отмена</text><rect x="520" y="422" width="90" height="36" rx="9" fill="#172033"/><text x="544" y="445" fill="#fff" class="small" font-weight="700">Сохранить</text></g></svg>
