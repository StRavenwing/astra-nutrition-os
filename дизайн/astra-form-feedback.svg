<svg xmlns="http://www.w3.org/2000/svg" width="900" height="620" viewBox="0 0 900 620"><defs><style>.s{font-family:Inter,Arial,sans-serif}.ink{fill:#172033}.muted{fill:#7D879B}.white{fill:#fff}.body{font-size:14px;font-weight:500}.small{font-size:12px;font-weight:500}.h2{font-size:20px;font-weight:750}</style></defs><rect width="900" height="620" fill="#E9EDF4"/><rect x="126" y="38" width="648" height="544" rx="22" fill="#fff"/><g class="s"><text x="170" y="90" class="ink h2">Обратная связь</text><text x="170" y="118" class="muted body">Расскажите, что улучшить или где нужна помощь</text><text x="170" y="174" class="muted small">Сообщение</text><rect x="170" y="188" width="560" height="160" rx="12" fill="#fff" stroke="#DDE3EC"/><text x="194" y="222" class="muted body">Напишите сообщение…</text><text x="170" y="394" class="muted small">Категория</text><rect x="170" y="408" width="260" height="48" rx="10" fill="#fff" stroke="#DDE3EC"/><text x="192" y="438" class="ink body">Предложение ▾</text><text x="170" y="492" class="muted small">Ответ появится в разделе «Ваши сообщения».</text><rect x="600" y="468" width="130" height="42" rx="10" fill="#172033"/><text x="632" y="494" fill="#fff" class="small" font-weight="700">Отправить</text></g></svg>
