name: Astra mobile clients

on:
  pull_request:
    paths:
      - "mobile/**"
      - ".github/workflows/mobile.yml"
  push:
    branches: [main]
    paths:
      - "mobile/**"
      - ".github/workflows/mobile.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    name: Android debug build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
      - run: gradle :app:assembleDebug
        working-directory: mobile/android

  ios:
    name: iOS simulator build
    runs-on: macos-14
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build for simulator
        run: xcodebuild -project mobile/ios/AstraMobile.xcodeproj -target AstraMobile -sdk iphonesimulator -configuration Debug CODE_SIGNING_ALLOWED=NO build
